name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint (reported, not blocking: old code still has many warnings-as-errors)
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build
        env:
          # Placeholders only so the build can run; nothing here is a real key.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          JWT_SECRET: ci-placeholder-secret-for-build-only
          CSRF_SECRET: ci-placeholder-secret-for-build-only
          PASSWORD_PEPPER: ci-placeholder
      - name: Security advisories (reported)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
